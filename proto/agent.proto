syntax = "proto3";

// The Deplo server-agent contract: the second system boundary, alongside GraphQL (UI
// <-> control plane). See docs/research/server-agent/PLAN.md and
// docs/adr/0006-server-agent-is-a-per-host-go-binary.md.
package deplo.agent.v1;

option go_package = "github.com/DeploCloud/deplo-agent/gen;agentpb";

// CONTRACT VERSION. Bumped when the wire contract changes incompatibly. The
// control plane sends its version in HelloRequest and the agent echoes its own
// in HelloResponse; a mismatch is surfaced, never silently tolerated.
enum ContractVersion {
  CONTRACT_VERSION_UNSPECIFIED = 0;
  CONTRACT_VERSION_V1 = 1;
}

service Agent {
  // Health + identity handshake. The control plane calls this as a mandatory
  // pre-flight before every deploy (PLAN P5): if the agent does not answer, the
  // deploy fails immediately with "server unreachable" rather than hanging.
  rpc Hello(HelloRequest) returns (HelloResponse);

  // Host CPU/mem/disk/net snapshot. Replaces lib/infra/host.ts per server.
  // (Wired into getServerMetrics in Part C; defined now so the contract is whole.)
  rpc Metrics(MetricsRequest) returns (HostMetrics);

  // Per-CONTAINER live resource snapshot (`docker stats --no-stream`) for the named
  // containers of ONE project - the data source for the per-app / per-database
  // Monitoring tab, next to the host-level Metrics above.
  rpc ContainerStats(ContainerStatsRequest) returns (ContainerStatsResponse);

  // ONE long-lived stream carrying this host's metrics AND every Deplo-managed
  // container's stats, sampled on the AGENT's own ticker.
  rpc StreamMetrics(MetricsStreamRequest) returns (stream MetricsSample);

  // Deploy lifecycle. Server-streaming so build/run logs flow live, in one
  // connection, into the control plane's existing per-deployment log + status
  // writes (which republish over the GraphQL SSE subscriptions unchanged).
  rpc Deploy(DeployRequest) returns (stream DeployEvent);

  // Reconnect to an in-flight (or just-finished) deploy and replay the events the
  // control plane missed (PLAN D5, Part-B half).
  rpc ReattachDeploy(ReattachRequest) returns (stream DeployEvent);

  // Lifecycle control over an already-deployed stack. These replace the direct
  // stop/start/destroy docker calls in lib/deploy/build.ts for agent-owned
  // stacks. (Wired in a later step; defined now so the boundary is complete.)
  rpc StopStack(StackRef) returns (StackResult);
  rpc StartStack(StackRef) returns (StackResult);
  rpc DestroyStack(StackRef) returns (StackResult);

  // Re-apply routing to a running stack WITHOUT a rebuild.
  rpc Reroute(RerouteRequest) returns (StackResult);

  // Copy a single Docker named volume across HOSTS, for a server MOVE (a
  // database/project relocating to another server).
  rpc ExportVolume(ExportVolumeRequest) returns (stream VolumeChunk);

  // The destination half of a cross-host volume copy (see ExportVolume). The caller
  // MUST have stopped the destination stack first so nothing writes the volume under
  // the untar.
  rpc ImportVolume(stream VolumeChunk) returns (StackResult);

  // How much disk a named volume occupies. The caller supplies the names (Deplo's
  // volume-naming scheme stays control-plane-side, as for backup and move).
  rpc VolumeUsage(VolumeUsageRequest) returns (VolumeUsageResponse);

  // Copy a service's host-side FILES DIR (<stack_dir>/files/<slug>) across hosts, for a
  // server move - the sibling of ExportVolume/ImportVolume for the one piece of a
  // service's state that is NOT a Docker volume.
  rpc ExportFiles(ExportFilesRequest) returns (stream FilesChunk);

  // The destination half of a files-dir copy (see ExportFiles). The FIRST client
  // message MUST be a FilesChunk carrying `header` (the target slug + wipe flag); every
  // subsequent message carries `data` (a slice of the gzipped tar).
  rpc ImportFiles(stream FilesChunk) returns (StackResult);

  // Copy an arbitrary HOST DIRECTORY off this machine - the bind-mount half of a
  // migration from another platform, where a service's data may sit in a plain
  // directory rather than in a Docker volume.
  rpc ExportHostPath(ExportHostPathRequest) returns (stream VolumeChunk);

  // The destination half of a host-directory copy (see ExportHostPath). First
  // message carries the header (target path + wipe flag), the rest carry the
  // gzipped tar. Same deferred wipe as ImportVolume: no data, no wipe.
  rpc ImportHostPath(stream HostPathChunk) returns (StackResult);

  // Stream a BUILT IMAGE off this host, for a build server: the third sibling of the
  // volume and files-dir relays, and the same star-topology reasoning - the control
  // plane calls ExportImage on the BUILDER and feeds the chunks into ImportImage on the
  // host that will run it.
  rpc ExportImage(ExportImageRequest) returns (stream ImageChunk);

  // The destination half of an image copy (see ExportImage). The FIRST client message
  // MUST be an ImageChunk carrying `header`; every subsequent message carries `data`.
  rpc ImportImage(stream ImageChunk) returns (StoreResult);

  // Read back the rendered stack YAML the agent has on disk (<stack_dir>/<slug>.yml)
  // for the "View full compose" preview. Returns exists=false (empty yaml) when no
  // stack file is present yet (never deployed).
  rpc ReadStack(StackRef) returns (ReadStackResponse);

  // Container introspection (status/running) for the live-status subscriptions.
  rpc Inspect(InspectRequest) returns (InspectResponse);

  // Whether a HOST TCP port is free to publish.
  rpc CheckPort(CheckPortRequest) returns (CheckPortResponse);

  // ONE bounded HTTP GET to a container of an app's own stack, issued from the host
  // over Docker's network - what a compose app's icon detection reads. The only way to
  // see it is to ask the running app for it, exactly as a browser would.
  rpc ProbeHttp(ProbeHttpRequest) returns (ProbeHttpResponse);

  // Reclaim Docker disk on the host. Those verbs are absent from CleanupScope and must
  // never be added.
  rpc DockerCleanup(DockerCleanupRequest) returns (DockerCleanupResponse);

  // Update the agent BINARY in place to a newer release, WITHOUT re-bootstrapping - the
  // agent's mTLS materials (agent.crt/agent.key/ca.crt under --agent-dir) are NEVER
  // touched, so the server keeps its identity and pinned fingerprint across the upgrade
  // and stays "online".
  rpc SelfUpdate(SelfUpdateRequest) returns (SelfUpdateResponse);

  // Remove the agent's own footprint from this host and stop: the systemd unit, the
  // binary, and the state dir under --agent-dir (mTLS materials included). The sibling
  // of SelfUpdate, and the ONLY RPC that ends the agent's own life.
  rpc SelfUninstall(SelfUninstallRequest) returns (SelfUninstallResponse);

  // ---- BACKUPS: dump/restore a database or project to/from a DESTINATION, plus the
  // affordances the control plane needs (connectivity check + object delete).
  // StoreTarget - a directory on THIS host's filesystem.

  // Back up a database or a project to a destination, streaming progress.
  rpc Backup(BackupRequest) returns (stream BackupEvent);

  // Restore a database or project from a previously-written artifact, IN PLACE,
  // streaming progress. A restart failure (e.g. a snapshot image that no longer exists)
  // is reported clearly on the stream rather than silently leaving the stack down.
  rpc Restore(RestoreRequest) returns (stream RestoreEvent);

  // Verify a destination for the "Test connection" button. An S3 check needs no Docker
  // and no host state, so any agent advertising "backup" can serve it; a STORE check is
  // about THIS host's disk, so it must run on the destination's own server.
  rpc S3Check(S3CheckRequest) returns (S3CheckResponse);

  // Delete artifacts by exact key or by prefix.
  rpc S3Delete(S3DeleteRequest) returns (S3DeleteResponse);

  // ---- BACKUP STORES: the relay primitives that let an artifact live on a server that
  // is NOT the one running the workload.

  // Stream an artifact OUT, for a restore or a download whose reader lives elsewhere.
  // The artifact is either on this host's store or in a bucket this host can dial
  // (`store` or `s3`).
  rpc ReadStoreFile(ReadStoreFileRequest) returns (stream StoreChunk);

  // Receive an artifact INTO this host's store. The FIRST client message MUST carry
  // `header` (the destination root + object key); every following message carries
  // `data`.
  rpc WriteStoreFile(stream StoreChunk) returns (StoreResult);

  // Restore from an artifact this host CANNOT reach - the cross-host half of Restore.
  rpc RestoreFrom(stream RestoreChunk) returns (stream RestoreEvent);

  // ---- PART C: console observability (replaces lib/logs + lib/attach +
  // the direct-Docker half of lib/data/console.ts for remote projects) ----

  // Stream a container's live runtime logs (`docker logs -f --tail N`) as raw byte
  // chunks. Closing the stream (browser disconnect) cancels the RPC, which kills the
  // agent's `docker logs` client only, never the container.
  rpc FollowLogs(FollowLogsRequest) returns (stream LogChunk);

  // Interactive `docker attach` to a running container, full-duplex over one bidi
  // stream. `--sig-proxy` is off, so a client disconnect never signals the container.
  rpc Attach(stream AttachInput) returns (stream AttachOutput);

  // Every attachable container in a project's stack (replaces listInstances +
  // inspectRuntime + inspectStdio in lib/data/console.ts), default (exposed/ running)
  // first.
  rpc ListInstances(ListInstancesRequest) returns (ListInstancesResponse);

  // Run a command in a container (`docker exec`), replacing execInContainer.
  rpc Exec(ExecRequest) returns (ExecResponse);

  // The default (or chosen) container's shell label ("/bin/sh" | "/bin/bash" |
  // "raw exec (no shell)") for the console banner - replaces shellLabel.
  rpc ShellLabel(ShellLabelRequest) returns (ShellLabelResponse);

  // ---- CRON JOBS: a scheduled `docker exec` the AGENT owns for its whole lifetime,
  // polled by the control plane's scheduler ---- Deliberately NOT Exec.

  // Spawn a command in a container and return immediately with its handle.
  rpc StartJob(StartJobRequest) returns (StartJobResponse);

  // The job's current state. Output is returned ONLY on the terminal poll -
  // streaming it every minute for every in-flight job would be megabytes of
  // wire for data nobody stores, and the container's own logs are right there.
  rpc PollJob(PollJobRequest) returns (PollJobResponse);

  // Kill a running job (the user pressed Stop, or the control plane's own
  // deadline passed while this agent still reported it running). Idempotent:
  // an unknown or already-finished job answers {found: false}, not an error.
  rpc KillJob(KillJobRequest) returns (KillJobResponse);

  // ---- PART C: project config files (repoints lib/data/project-files.ts off the
  // control plane's local fs onto the project's host; the anti-traversal sandbox is
  // re-enforced agent-side via internal/safepath since the path arrives off the wire)
  // ----

  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);
  rpc ReadFile(ReadFileRequest) returns (ReadFileResponse);
  rpc WriteFile(WriteFileRequest) returns (FileEntryResult);
  rpc UploadFile(UploadFileRequest) returns (FileEntryResult);
  rpc CreateDir(CreateDirRequest) returns (FileEntryResult);
  rpc DeleteFile(DeleteFileRequest) returns (DeleteFileResult);
  rpc RenameFile(RenameFileRequest) returns (FileEntryResult);
  // Whether a project's files root exists on this host (drives the Files tab).
  rpc FilesExist(FilesExistRequest) returns (FilesExistResponse);

  // ---- PART D: dev containers + SSH gateway per server (repoints lib/deploy/dev.ts +
  // lib/infra/ssh-gateway.ts off the control plane's local Docker/fs onto the project's
  // host).

  // Start (or restart) a project's dev container.
  rpc StartDev(StartDevRequest) returns (stream DeployEvent);
  // Stop a project's dev container (reversible - KEEPS the workspace + deps
  // volume so a later StartDev resumes the edited tree). Also stops the tunnel.
  rpc StopDev(StopDevRequest) returns (StackResult);
  // DESTRUCTIVE: wipe the workspace + deps volume, then reseed via StartDev's
  // body. The request carries the same StartDevRequest payload used to reseed.
  rpc ResetDevWorkspace(StartDevRequest) returns (stream DeployEvent);
  // Fully tear down on PROJECT DELETE: stop the stack, remove the stack file +
  // deps volume, WIPE the workspace dir. The gateway singleton is NOT torn down
  // (its per-project users are removed via DeprovisionSshUser).
  rpc TeardownDev(TeardownDevRequest) returns (StackResult);

  // ---- SSH gateway (the per-host singleton, ADR-0002) ----

  // Lazily ensure the 2-service SSH gateway stack is up on this host (idempotent;
  // ensureNetwork + write the rendered config files + `compose up` + wait for sshd +
  // reconcile every supplied user).
  rpc EnsureGateway(EnsureGatewayRequest) returns (StackResult);
  // Provision one user inside the running gateway by running the control-plane-
  // computed exec steps (the password, if any, rides in a step's stdin, never
  // argv/env). Ensures the gateway first (carries the same gateway payload).
  rpc ProvisionSshUser(ProvisionSshUserRequest) returns (StackResult);
  // Remove one user from the gateway (account + key + map files). No-op if the
  // gateway isn't running. Runs the control-plane-computed deprovision steps.
  rpc DeprovisionSshUser(DeprovisionSshUserRequest) returns (StackResult);

  // ---- VS Code Remote Tunnel (the editor integration for an exec-only gateway).

  // Launch the tunnel (idempotent) and return the current raw log + running flag.
  rpc StartTunnel(TunnelRequest) returns (TunnelStatus);
  // Read the current tunnel log + running flag (no side effects).
  rpc GetTunnel(TunnelRequest) returns (TunnelStatus);
  // Stop the tunnel process (the CLI download + auth token are kept).
  rpc StopTunnel(TunnelRequest) returns (StackResult);

  // ---- CERT RENEWAL: the agent's mTLS leaf is minted once at bootstrap (~365d). A
  // failed renewal is a no-op, the current cert stays valid until expiry, so a
  // renewal bug can never black out the fleet.

  // Generate a fresh keypair + CSR for renewal; the new private key is held
  // PENDING on the host (never sent) until InstallRenewedCert confirms the match.
  rpc RenewalCSR(RenewalCSRRequest) returns (RenewalCSRResponse);
  // Install the CA-signed leaf produced from the last RenewalCSR: the agent
  // verifies the cert matches the pending key, atomically swaps cert+key on disk,
  // and hot-reloads its TLS config so new handshakes present the fresh cert.
  rpc InstallRenewedCert(InstallRenewedCertRequest) returns (StackResult);

  // ---- HOST OPS: the four host-level actions the Servers page needs, none of which is
  // scoped to an app. Gated behind ONE "hostops" capability - they ship in the same
  // release, so four flags would buy nothing.

  // Static host identity - the neofetch answer, not the gauge.
  rpc HostInfo(HostInfoRequest) returns (HostInfoResponse);

  // Set the host's timezone (IANA name, e.g. "Europe/Rome"). `timedatectl` when
  // present, otherwise relinking /etc/localtime.
  rpc SetTimezone(SetTimezoneRequest) returns (HostInfoResponse);

  // Rewrite and/or restart THIS host's `deplo-traefik` stack - the reverse proxy the
  // installer put at $AGENT_DATA/traefik/docker-compose.yml.
  rpc TraefikConfig(TraefikConfigRequest) returns (TraefikConfigResponse);

  // Restart the container running the Deplo control plane on THIS host (agent 0 only -
  // a remote has no panel to restart).
  rpc RestartControlPlane(RestartControlPlaneRequest) returns (RestartControlPlaneResponse);
}

// ---------------------------------------------------------------------------
// Cert renewal
// ---------------------------------------------------------------------------

message RenewalCSRRequest {}

message RenewalCSRResponse {
  // PEM-encoded PKCS#10 CSR for a freshly generated keypair. The matching private
  // key is held PENDING on the agent and never leaves the host.
  string csr_pem = 1;
}

message InstallRenewedCertRequest {
  // The CA-signed leaf certificate (PEM) produced from the last RenewalCSR's CSR.
  string cert_pem = 1;
  // The CA certificate (PEM); the agent refreshes its trust pool too if non-empty.
  // Empty ⇒ keep the existing CA (the common case - only the leaf rotates).
  string ca_pem = 2;
}

// ---------------------------------------------------------------------------
// Hello / identity
// ---------------------------------------------------------------------------

message HelloRequest {
  // The contract version the control plane speaks.
  ContractVersion contract_version = 1;
  // Opaque control-plane build string, for the agent's logs (not a trust input).
  string control_plane_version = 2;
}

message HelloResponse {
  // The contract version the agent speaks. Compared against the request's.
  ContractVersion contract_version = 1;
  // Agent binary version (e.g. a git describe), for diagnostics.
  string agent_version = 2;
  // Whether a Docker daemon is reachable from the agent. A false here is a
  // clear, early "server can't deploy" signal.
  bool docker_available = 3;
  // Docker server engine version, or "" if unreachable.
  string docker_version = 4;
  // Coarse capability flags so the control plane can route only what this agent
  // supports (Part A: a localhost agent that handles the Dockerfile build +
  // single-image compose-up path).
  repeated string capabilities = 5;
  // Whether a Traefik reverse proxy is running on this host (a container on the shared
  // `deplo` network that reads the deploy labels and routes traffic). Without Traefik,
  // deployed apps run on the host but are not reachable on their domains.
  bool traefik_running = 6;
  // This host's CPU architecture, from Go's runtime.GOARCH: "amd64" or "arm64" (the two
  // the release publishes binaries for).
  string host_arch = 7;
}

// ---------------------------------------------------------------------------
// Metrics
// ---------------------------------------------------------------------------

message MetricsRequest {
  // The path whose filesystem to measure for disk usage (the agent's data dir).
  // Empty => the agent's default ("/").
  string data_dir = 1;
}

message HostMetrics {
  double cpu = 1;        // 0-100
  int32 cpu_cores = 2;
  int64 mem_used = 3;    // bytes
  int64 mem_total = 4;
  double mem_pct = 5;
  int64 disk_used = 6;   // bytes
  int64 disk_total = 7;
  double disk_pct = 8;
  int64 net_rx = 9;      // bytes/sec
  int64 net_tx = 10;     // bytes/sec
  double load1 = 11;
  double load5 = 12;
  double load15 = 13;
  int64 uptime_sec = 14;
  int32 running_containers = 15;

  // Fields 16-17 are ADDITIVE (contract stays V1). mem_used is total-available,
  // the same figure `free` prints as "used"; these two let the panel also show
  // the reclaimable half rather than leaving the gap with htop unexplained.
  int64 mem_free = 16;   // MemFree
  int64 mem_cache = 17;  // Buffers + Cached + SReclaimable
}

// ---------------------------------------------------------------------------
// Deploy
// ---------------------------------------------------------------------------

// Where the agent gets the bytes it builds/runs. Part B implements GIT (the agent
// clones with a short-lived token, D3) so a remote build never ships the whole repo
// over the wire - only the clone URL + branch + ephemeral token.
enum SourceKind {
  SOURCE_KIND_UNSPECIFIED = 0;
  // The control plane streams a tar archive of the materialised build context
  // inside this Deploy call (see DeployRequest.context_chunk). One direction of
  // traffic, one mTLS channel, no second control-plane endpoint (D3).
  SOURCE_KIND_UPLOAD = 1;
  // The agent runs a prebuilt image as-is (source: docker-image). No build.
  SOURCE_KIND_IMAGE = 2;
  // The agent clones a git URL itself with a short-lived token. PART B.
  SOURCE_KIND_GIT = 3;
  // A multi-service compose stack: the control plane rendered the full stack
  // (buildComposeStack - Traefik labels, deplo-network wiring, the deplo.* labels on
  // EVERY service) into compose_yaml; the agent neither builds nor pulls an image (each
  // service's image comes up via `docker compose up` itself).
  SOURCE_KIND_COMPOSE = 4;
  // PART D: "deploy from dev workspace". The build context is the project's PERSISTENT
  // dev workspace already on THIS agent's host (<dev-dir>/<slug>) - the developer's
  // live, edited tree.
  SOURCE_KIND_DEV_WORKSPACE = 5;
}

// How the agent turns the build context into an image.
enum BuildKind {
  BUILD_KIND_UNSPECIFIED = 0;
  BUILD_KIND_NONE = 1;        // SOURCE_KIND_IMAGE: run as-is, no build
  BUILD_KIND_DOCKERFILE = 2;  // build from a Dockerfile in the context
  // The heavy builders. Each reads DeployRequest.build_spec for its method
  // settings (port, commands, runtime version, per-method knobs). The agent ports
  // builders.ts byte-for-byte so an image built here matches the old local path.
  BUILD_KIND_STATIC = 3;      // nginx serves a build output (buildStatic)
  BUILD_KIND_NIXPACKS = 4;    // nixpacks generates a Dockerfile, then docker build
  BUILD_KIND_BUILDPACKS = 5;  // Cloud Native Buildpacks via `pack` (heroku|paketo)
  BUILD_KIND_RAILPACK = 6;    // railpack plan + buildkitd/buildctl
}

// The build method's settings for a heavy BuildKind (STATIC/NIXPACKS/BUILDPACKS/
// RAILPACK).
message BuildSpec {
  // The build method name, for logs + the buildpacks flavor select
  // ("nixpacks"|"heroku"|"paketo"|"railpack"|"static"). The agent dispatches on
  // build_kind, not this string; it is the human label + the heroku/paketo split.
  string method = 1;
  // The container port the app listens on (drives PORT/--build-arg PORT and the
  // nginx `listen`). 0 => the method's default (nginx 80).
  int32 port = 2;
  // Build commands (empty => the method's own default / detection). Mirror
  // BuildConfig.installCommand / buildCommand / startCommand.
  string install_command = 3;
  string build_command = 4;
  string start_command = 5;
  // The static method's output dir to serve (BuildConfig.outputDirectory). Empty
  // => ".".
  string output_directory = 6;
  // The runtime version the user pinned (BuildConfig.runtimeVersion), e.g. "20".
  // Empty => the method's default.
  string runtime_version = 7;
  // The framework's runtime language, resolved control-plane-side via
  // runtimeFor(framework).language ("node"|"python"|…|"none").
  string runtime_language = 8;
  // nixpacks: the dir the build publishes/serves; non-empty switches nixpacks to
  // the nginx-wrap static path (methodSettings.nixpacksPublishDirectory).
  string nixpacks_publish_directory = 9;
  // heroku: builder image version ("22"|"24"|"26"); maps to heroku/builder:<v>.
  // Empty => "24". Ignored for paketo (methodSettings.herokuVersion).
  string heroku_version = 10;
  // railpack: CLI/frontend version pin ("latest" or "0.27.2"); empty => latest
  // (methodSettings.railpackVersion).
  string railpack_version = 11;
  // static / nixpacks-static: serve as an SPA (history-API fallback to
  // index.html) (methodSettings.staticSinglePageApp).
  bool static_single_page_app = 12;
}

// A git source the agent clones itself (SOURCE_KIND_GIT, D3). The token is the only
// secret here and it is ephemeral, nothing long-lived crosses the wire, and the agent
// never persists it.
message GitSource {
  // The clone URL.
  string url = 1;
  // The branch (or ref) to check out. Empty => the remote's default branch.
  string branch = 2;
  // An optional short-lived credential the agent injects as the URL's
  // x-access-token (when `url` does not already carry one). Empty for public
  // repos or when the token is already baked into `url`. Never logged.
  string token = 3;
  // Sub-directory within the repo to build from (the project's rootDirectory),
  // relative to the clone root. Empty => the repo root. Re-validated against the
  // clone root inside the agent (anti-escape, like the Dockerfile paths).
  string subdir = 4;
}

message DockerfileBuild {
  // Path to the Dockerfile, relative to the build context root. Re-validated against
  // the context root inside the agent (the anti-escape check is re-ported to Go - path
  // validation runs where the I/O runs, never trusting a path off the wire).
  string dockerfile_path = 1;
  // Build context dir, relative to the context root. Empty => ".".
  string context_path = 2;
  // Optional --target stage in a multi-stage Dockerfile.
  string target_stage = 3;
  // When true the agent has no Dockerfile in the context and must build the
  // provided generated_dockerfile content instead (the legacy/auto path).
  bool generated = 4;
  // The generated Dockerfile body (only when `generated` is true). Rendered by
  // the control plane (generateDockerfile) so the agent stays dumb about
  // framework presets - same single-source-of-truth principle as the compose.
  string generated_dockerfile = 5;
}

// One template config file a compose stack bind-mounts (SOURCE_KIND_COMPOSE).
message MountFile {
  string path = 1;
  string content = 2;
}

// One container-registry credential. `host` is the docker config key the CLI
// matches an image against ("ghcr.io", "https://index.docker.io/v1/" for the Hub);
// the control plane normalises it, the agent writes it verbatim.
message RegistryAuth {
  string host = 1;
  string username = 2;
  string password = 3;
}

message DeployRequest {
  // A stable id for this deploy, minted by the control plane (the Deployment row id).
  // The control plane reconciles a still-"building" deploy to error on restart even
  // though Part A is otherwise fire-and-forget.
  string deploy_id = 1;

  // Project identity. `slug` keys the stack file, compose project, container
  // name and labels on the agent; `project_id` goes into the deplo.* labels.
  string slug = 2;
  string project_id = 3;

  // The target image tag the agent builds/runs, e.g. deplo/<slug>:<sha12>.
  string image_ref = 4;

  SourceKind source_kind = 5;
  BuildKind build_kind = 6;
  // Present iff build_kind == DOCKERFILE.
  DockerfileBuild dockerfile = 7;

  // Present iff source_kind == GIT (Part B). The agent clones this itself; the
  // control plane does not tar a context for git sources targeting a remote
  // agent - only the descriptor crosses the wire (D3).
  GitSource git = 13;

  // The fully-rendered compose YAML (D2): renderCompose stays the single TS source of
  // truth; the agent receives opaque YAML and never re-implements routing/label logic
  // in Go.
  string compose_yaml = 8;

  // The resolved, DECRYPTED env map (D4). The control plane decrypts via revealEnv and
  // sends plaintext over mTLS; the agent writes it to a 0600 env-file and never holds
  // the encryption key.
  map<string, string> env = 9;

  // How long to wait for the container to report running before declaring the
  // deploy errored, in milliseconds. 0 => the agent's default.
  int64 ready_timeout_ms = 10;

  // The streamed build context, used iff source_kind == UPLOAD. The FIRST DeployRequest
  // on the stream carries all the fields above; SUBSEQUENT messages on the stream carry
  // ONLY context_chunk frames (every other field empty) until an empty/final marker.
  bytes context_tar = 11;

  // True when image_ref must be pulled before running (SOURCE_KIND_IMAGE with a
  // remote registry ref). The agent `docker pull`s it, streaming progress.
  bool pull_image = 12;

  // Template config files a multi-service compose stack bind-mounts
  // (SOURCE_KIND_COMPOSE). Written under <stack_dir>/files/<slug>/ before
  // `compose up`. Empty for every other source kind.
  repeated MountFile mounts = 14;

  // The rootDirectory subdir within the dev workspace to build from, relative to the
  // workspace root (SOURCE_KIND_DEV_WORKSPACE, Part D).
  string dev_workspace_subdir = 15;

  // The heavy build method's settings - present iff build_kind is STATIC / NIXPACKS /
  // BUILDPACKS / RAILPACK.
  BuildSpec build_spec = 16;

  // Build this deploy WITHOUT the host's layer cache: every `docker build` runs with
  // --no-cache, and nixpacks is left on its default (per-build-dir) cache key so its
  // BuildKit cache mounts start empty too.
  bool no_build_cache = 17;

  // Replace the running containers even when the rendered stack is unchanged (`docker
  // compose up --force-recreate`).
  bool force_recreate = 18;

  // Extra flags APPENDED to the `docker compose … up -d --remove-orphans` the agent
  // already assembles (e.g. ["--pull", "always"]). The agent re-validates and drops
  // anything that would (see sanitizeComposeArgs).
  repeated string compose_up_args = 19;

  // Build the image and STOP: no stack file is written, nothing is brought up, and this
  // host runs no container for the app. Set when the app builds on a BUILD SERVER - a
  // host that compiles for machines it does not run on.
  bool build_only = 20;

  // The team's registry credentials, DECRYPTED by the control plane (same discipline
  // as `env`). The agent writes them to a 0600 docker config used for this deploy
  // only, so every pull it makes - image ref, compose images, a Dockerfile's base
  // image - can authenticate. Empty for a team that connected no registry.
  repeated RegistryAuth registry_auth = 21;

  // The Docker network this stack's routed services join, named after the app's
  // Environment (or its team when it has none). The agent creates it if missing and
  // connects Traefik to it. Empty is REJECTED - there is no shared default any more.
  string network = 22;
}

// One event in the deploy stream. Exactly one of the oneof arms is set.
message DeployEvent {
  oneof event {
    LogLine log = 1;
    PhaseChange phase = 2;
    DeployResult result = 3;
  }
  // Monotonic per-deploy sequence number (1-based), the REPLAY CURSOR for
  // ReattachDeploy (D5).
  uint64 seq = 4;
}

// Reconnect to an in-flight or recently-finished deploy and replay from a cursor (D5).
message ReattachRequest {
  // The deploy to reattach to (the same stable id from DeployRequest.deploy_id).
  string deploy_id = 1;
  // Replay every buffered event with seq strictly greater than this. 0 => from
  // the very first event the agent still has buffered.
  uint64 from_seq = 2;
}

message LogLine {
  // info | warn | error | debug | command - mirrors lib/types.ts LogLevel so the
  // control plane writes it straight into the deployment log.
  string level = 1;
  string text = 2;
}

enum DeployPhase {
  DEPLOY_PHASE_UNSPECIFIED = 0;
  DEPLOY_PHASE_PREPARING = 1;   // materialising context / pulling
  DEPLOY_PHASE_BUILDING = 2;    // docker build
  DEPLOY_PHASE_STARTING = 3;    // docker compose up
  DEPLOY_PHASE_WAITING = 4;     // waiting for running
}

message PhaseChange {
  DeployPhase phase = 1;
}

message DeployResult {
  // Terminal status: true => the stack reached a running state; false => failed.
  bool ready = 1;
  // A human-readable reason on failure (empty on success).
  string error = 2;
  // The git commit sha the agent resolved when it materialised a GIT source (Part B):
  // the control plane writes it back to the Deployment row.
  string commit_sha = 3;
}

// ---------------------------------------------------------------------------
// Stack lifecycle + introspection
// ---------------------------------------------------------------------------

message StackRef {
  string slug = 1;
  // Tear down the stack's named volumes too (`docker compose down -v`) and remove the
  // on-disk compose file.
  bool remove_volumes = 2;
  // DestroyStack only: named volumes to reclaim BY NAME, on top of whatever the `down
  // -v` finds. Every entry must start with `deplo-` (the agent refuses the rest), so
  // this can only ever reclaim volumes Deplo itself creates.
  repeated string reclaim_volumes = 3;
}

message StackResult {
  bool ok = 1;
  string error = 2;
  // ImportVolume / ImportFiles only: how many bytes of the COMPRESSED stream this host
  // actually consumed, and their sha256.
  int64 bytes_written = 3;
  string sha256 = 4;
  // ImportVolume / ImportHostPath only: entries the sanitising import refused to write -
  // here, links whose target leaves the archive. Left empty by an agent without the
  // "volume-copy.drop-report" capability, which reads as "not reported", never "none".
  int32 dropped_links = 5;
  // Device, fifo and socket entries dropped. Stripped mode bits are not counted: they
  // change no content.
  int32 dropped_special = 6;
  // The first few dropped entry names, truncated, so a message can name them.
  repeated string dropped_names = 7;
}

// ---------------------------------------------------------------------------
// Cross-host volume copy (server move) - see ExportVolume / ImportVolume
// ---------------------------------------------------------------------------

message ExportHostPathRequest {
  // An ABSOLUTE, already-existing host directory. Refused when it is missing, is
  // not a directory, climbs with "..", or names one of the system roots the agent
  // will not hand over wholesale.
  string path = 1;
  // Accept a plain FILE at `path` too, streamed as a one-entry tar. Its DIRECTORY
  // is deny-listed as well, so a file never reaches further than the directory
  // holding it would.
  bool allow_file = 2;
}

message HostPathChunk {
  message Header {
    // The ABSOLUTE host directory on the DESTINATION to untar into. Created if it
    // does not exist (its PARENT must, so a typo cannot scatter a tree across the
    // filesystem); refused for the same system roots as the export.
    string path = 1;
    // Empty the target first. Applied on the FIRST DATA FRAME, never on the header
    // alone - see VolumeChunk.Header.wipe_first for why.
    bool wipe_first = 2;
    // `path` names a FILE, not a directory: the archive holds its single entry and
    // replaces it in place. Without this the agent creates a DIRECTORY at `path`,
    // which is what a stack that binds a config file comes back up on.
    bool file = 3;
  }
  oneof frame {
    Header header = 1;
    bytes data = 2;
  }
}

message ExportVolumeRequest {
  // The FULL Docker named volume to tar out (e.g. `deplo-db-mydb_db-mydb-data`). The
  // volume must already exist on this host.
  string volume_name = 1;
}

message VolumeUsageRequest {
  // FULL Docker named volumes, validated like ExportVolumeRequest.volume_name.
  repeated string volume_names = 1;
}

message VolumeUsage {
  string volume_name = 1;
  // On-disk bytes (allocated blocks, so a sparse file counts what it occupies).
  int64 bytes = 2;
}

message VolumeUsageResponse {
  // One entry per volume that EXISTS; an absent name is simply omitted, never
  // reported as zero - "no such volume" is not "an empty volume".
  repeated VolumeUsage volumes = 1;
}

// A framed chunk of a cross-host volume transfer. ExportVolume emits a sequence of
// `data` chunks (no header). ImportVolume expects the FIRST message to be a
// `header` and all following messages to be `data`.
message VolumeChunk {
  message Header {
    // The FULL Docker named volume on the DESTINATION host to untar into. Created
    // on demand by the untar helper container if absent; re-validated like
    // ExportVolumeRequest.volume_name.
    string volume_name = 1;
    // Empty the target volume before untarring (default true for a move, so the import
    // overwrites rather than merges into whatever the freshly-provisioned stack
    // initialised).
    bool wipe_first = 2;
  }
  oneof frame {
    Header header = 1;
    // A raw slice of the gzipped tar stream. Chunked well under the gRPC max
    // message size; reassembled in order on the destination.
    bytes data = 2;
  }
}

message ExportFilesRequest {
  // The service slug whose files dir (<stack_dir>/files/<slug>) to tar out.
  // Re-validated agent-side (validateSlug) before it is joined into a path. A
  // missing dir yields an empty archive, not an error.
  string slug = 1;
}

// A framed chunk of a cross-host FILES-DIR transfer, mirroring VolumeChunk.
// ExportFiles emits `data` chunks (no header); ImportFiles expects a `header` first
// then `data` frames.
message FilesChunk {
  message Header {
    // The service slug whose files dir to untar into on the DESTINATION host.
    string slug = 1;
    // Empty the target files dir before untarring (default true for a move).
    bool wipe_first = 2;
  }
  oneof frame {
    Header header = 1;
    bytes data = 2;
  }
}

message ExportImageRequest {
  // The image tag to `docker save`, always the control plane's own
  // `deplo/<deploy_key>:<deployment id[:12]>`.
  string image_ref = 1;
  // `docker rmi` the image here once the stream completes successfully. True for
  // every build-server transfer: the builder holds no app images, only cache. A
  // failed export never removes anything.
  bool remove_after = 2;
}

// A framed chunk of a cross-host IMAGE transfer, mirroring VolumeChunk. ExportImage
// emits `data` chunks (no header); ImportImage expects a `header` first then `data`.
message ImageChunk {
  message Header {
    // The tag the stream is expected to carry. Must be `deplo/<name>:<tag>`; the
    // namespace is re-validated agent-side because this RPC also deletes images.
    string image_ref = 1;
  }
  oneof frame {
    Header header = 1;
    // A raw slice of the gzipped `docker save` stream. Same 1 MiB framing as the
    // volume relay; reassembled in order on the destination.
    bytes data = 2;
  }
}

// A label-only reroute of an already-deployed stack (no build, no env change
// beyond what the control plane re-sends). Mirrors the compose-write half of a
// Deploy: the control plane renders everything, the agent just writes + brings up.
message RerouteRequest {
  // Stack identity - keys the stack file, compose project and container name.
  string slug = 1;
  // The fully re-rendered stack YAML with the new domain/label set. Opaque to the
  // agent (same contract as DeployRequest.compose_yaml).
  string compose_yaml = 2;
  // Decrypted env for ${VAR} interpolation; written to <stack_dir>/<slug>.env
  // (0600) and passed as --env-file. Empty => no env-file.
  map<string, string> env = 3;
  // Compose mount files to (re)materialise under <stack_dir>/files/<slug>/ before
  // bringing the stack up. Empty for single-image projects.
  repeated MountFile mounts = 4;
  // The app's extra `compose up` flags, same contract as
  // DeployRequest.compose_up_args - a reroute brings the stack up too, so the
  // flags the operator asked for apply here as well.
  repeated string compose_up_args = 5;
  // Same contract as DeployRequest.network - a reroute brings the stack up too, so
  // the network must exist and Traefik must be on it.
  string network = 6;
}

message ReadStackResponse {
  // Whether a stack file exists on disk for this slug.
  bool exists = 1;
  // The rendered stack YAML (empty when exists=false).
  string yaml = 2;
}

message InspectRequest {
  // Inspect by container/stack name (the agent maps slug -> deplo-<slug>).
  string slug = 1;
}

message InspectResponse {
  bool exists = 1;
  bool running = 2;
  // Raw docker state string (running, exited, ...).
  string state = 3;
}

// Ask whether a host TCP port can be published (see the CheckPort RPC comment).
message CheckPortRequest {
  // The host port to test (1-65535). Out-of-range => the agent reports it as not
  // available with a reason, never a bind attempt.
  int32 port = 1;
}

message CheckPortResponse {
  // True when the agent could bind (and immediately released) the port on the
  // host - i.e. nothing else holds it right now.
  bool available = 1;
  // "" when available; otherwise a human-readable reason (in use / out of range).
  string reason = 2;
}

// One HTTP GET to a container of an app's stack (see the ProbeHttp RPC comment).
// The agent picks the ADDRESS; the caller only picks what to ask for.
message ProbeHttpRequest {
  // The app the container must belong to (its `deplo.project` label). Empty is
  // refused - an unscoped probe could reach any container on the host.
  string project_id = 1;
  // The app's slug, used to read the compose service out of a container name
  // (deplo-<slug>-<service>-N), exactly as ListInstances does.
  string slug = 2;
  // Which compose service to reach. Empty => the app's first running container
  // (the single-image case, where the stack has exactly one).
  string service = 3;
  // The port INSIDE the container (1-65535) - the same port Traefik is routed
  // to, not a published host port.
  int32 port = 4;
  // Absolute request path ("/", "/favicon.ico"). Must start with "/" and carry
  // no control characters; anything else is refused rather than sent.
  string path = 5;
  // Host header to send. Empty => the container's IP. An app that only answers
  // on its own hostname (ALLOWED_HOSTS, a configured site URL) needs its real
  // domain here. Validated as a hostname, never a URL, never a header list.
  string host = 6;
  // Cap on the body bytes returned. 0 => the agent's default; the agent clamps
  // to its own ceiling regardless, so a caller can never ask for an unbounded
  // read.
  int32 max_bytes = 7;
}

message ProbeHttpResponse {
  // HTTP status of the response (200, 404, 301, …).
  int32 status = 1;
  // Content-Type header, lowercased, parameters kept ("image/png",
  // "text/html; charset=utf-8"). Empty when the response carried none.
  string content_type = 2;
  // The body, truncated to max_bytes.
  bytes body = 3;
  // True when the body was longer than max_bytes and was cut.
  bool truncated = 4;
  // The Location header on a 3xx (empty otherwise). The agent does NOT follow
  // it: the control plane decides whether the target is still this app.
  string location = 5;
}

// In-place agent binary update (SelfUpdate). The agent stays otherwise dumb - it does
// not talk to the GitHub API or know the release repo, it just fetches the chosen URL,
// checks the digest, and swaps itself.
message SelfUpdateRequest {
  // The target version, normalized without a leading v (e.g. "1.2.0"). Used only
  // for logging + the response echo; the agent does not gate on it (the control
  // plane already decided this is the version to install).
  string version = 1;
  // The published binaries, keyed by Go arch ("amd64" | "arm64").
  map<string, ArchBinary> binaries = 2;
}

// One published binary asset for a single architecture.
message ArchBinary {
  // The asset download URL. The agent treats the bytes as opaque until the
  // checksum passes.
  string url = 1;
  // Lowercase hex sha256 the downloaded bytes MUST match. A mismatch aborts the
  // update with FAILED_PRECONDITION and the running binary is left untouched -
  // the agent never execs an unverified binary (install-agent.sh P2 parity).
  string sha256 = 2;
}

// What SelfUninstall removes. Taking any of them from the caller would be handing a
// remote peer an `rm -rf` argument.
message SelfUninstallRequest {}

message SelfUninstallResponse {
  // The absolute paths actually removed, for the control plane's activity trail and for
  // the operator to see what was on the box.
  repeated string removed = 1;
  // True once every removal has happened and the process is about to exit. The
  // reply is sent FIRST and the exit follows after a short grace period, so this
  // is the last thing this agent will ever say.
  bool stopping = 2;
}

message SelfUpdateResponse {
  // The version now staged on disk (echoes the request's version on success).
  string version = 1;
  // True once the new binary is in place and the agent is about to restart to exec it.
  bool restarting = 2;
}

// ---------------------------------------------------------------------------
// BACKUPS - dump/restore to S3 (Backup / Restore / S3Check / S3Delete)
// ---------------------------------------------------------------------------

// What a backup/restore targets. A DATABASE is dumped via the engine's tool
// (`docker exec`); a PROJECT is the tar of its volumes + files + the compose/
// env snapshot. New kinds are new enum cases, never a redesign (D6).
enum BackupKind {
  BACKUP_KIND_UNSPECIFIED = 0;
  BACKUP_KIND_DATABASE = 1;
  BACKUP_KIND_PROJECT = 2;
}

// The S3 destination the agent reads/writes with - the DECRYPTED creds (the control
// plane decrypts via decryptSecret and sends plaintext over mTLS; the agent never holds
// the encryption key, mirroring Deploy's env handling) plus the bucket coordinates and
// the exact object key.
message S3Target {
  string endpoint = 1;     // e.g. s3.amazonaws.com or a MinIO host:port
  string region = 2;       // e.g. us-east-1 ("" => the SDK default)
  string bucket = 3;
  string access_key = 4;   // decrypted; never logged
  string secret_key = 5;   // decrypted; never logged
  string object_key = 6;   // the exact object key (PUT/GET target)
  // Whether to address the bucket path-style (bucket in the URL path, not the
  // host). MinIO / many S3-compatibles need this; AWS uses virtual-host style.
  // The control plane decides from the destination's provider.
  bool path_style = 7;
  // Opt OUT of the SSRF guard that refuses an endpoint resolving to a loopback,
  // link-local or private address. It exists because deplo is a SELF-HOSTING platform
  // and "my MinIO is at 10.0.0.5" is the ordinary case, not the attack.
  bool allow_private_endpoint = 8;
  // Per-destination quirks of ONE S3-compatible store, as `--flag=value` tokens
  // (`--s3-sign-accept-encoding=false`, `--s3-force-path-style=true`, …).
  repeated string extra_args = 9;
}

// A directory on THIS host's filesystem that holds backup artifacts - the second
// destination shape, for a user who would rather keep backups on a VPS they already pay
// for than sign up for a bucket.
message StoreTarget {
  string root = 1;
  string object_key = 2;
}

// The database descriptor for a DATABASE backup/restore. The control plane
// resolves the container name + engine details from its store; the agent stays
// dumb about Deplo's DB model and just runs the right tool inside the container.
message DatabaseDescriptor {
  // The DB container to `docker exec` into (the agent re-derives nothing - it
  // execs exactly this name). For a Deplo DB this is the compose container of
  // the db-<name> stack.
  string container = 1;
  // The engine, lower-case: "postgres" | "mysql" | "mariadb" | "mongodb" |
  // "redis" | "clickhouse". Selects the dump/restore tool + flags.
  string db_type = 2;
  // The logical database name to dump/restore (the default DB for the engine).
  string db_name = 3;
  // The superuser the dump tool authenticates as inside the container.
  string user = 4;
  // The engine password, decrypted by the control plane.
  string password = 5;
}

// The project descriptor for a PROJECT backup/restore. The control plane resolves
// the persistent state's three shapes into a flat name list (host bind mounts
// excluded) so the agent stays dumb about Deplo's volume-naming scheme.
message ProjectDescriptor {
  // The project slug - keys the files dir (<stack-dir>/files/<slug>) and the
  // stack the restore re-Reroutes.
  string slug = 1;
  // The host volume names to tar: the named-volume shape (hostVolumeName =
  // deplo-<slug>-<name>) AND the compose-stack volumes the control plane parsed out of
  // the rendered YAML.
  repeated string volume_names = 2;
  // Whether to include the project files dir (<stack-dir>/files/<slug>) in the
  // archive. False when the project has no files dir.
  bool include_files = 3;
  // The rendered compose YAML snapshot, captured into the archive so a restore
  // can re-Reroute the EXACT config that was backed up (full data + config
  // restore). Opaque to the agent.
  string compose_yaml = 4;
  // The decrypted env snapshot for the re-Reroute on restore. Stored in the
  // archive; the env secrets are written 0600 like every other env-file. Empty
  // for single-image projects that bake env into the compose.
  map<string, string> env_snapshot = 5;
  // Compose mount files (template config) to re-materialise on restore, mirroring
  // RerouteRequest.mounts. Empty for single-image projects.
  repeated MountFile mounts = 6;
  // The app's CURRENT tenant network, for the Reroute a restore ends in. Set on the
  // RESTORE path only: a backup does not need it, and the network the app is on today
  // is not necessarily the one the snapshot was taken on.
  string network = 7;
}

message BackupRequest {
  BackupKind kind = 1;
  // The destination: exactly one of `s3` / `store`, unless `stream_out` is set
  // (in which case neither is needed - the caller IS the sink).
  S3Target s3 = 2;
  // Exactly one of these is set, per `kind`.
  DatabaseDescriptor database = 3;
  ProjectDescriptor project = 4;
  StoreTarget store = 5;
  // The age recipient ("age1…", an X25519 public key) the artifact is encrypted to.
  // REQUIRED whenever the artifact is not going to S3 - a store write or a stream_out
  // relay with an empty recipient is an ERROR, never a silent plaintext write.
  string age_recipient = 6;
  // Emit the artifact as BackupEvent.data frames instead of writing it anywhere. The
  // BackupResult still reports the size this host produced - the durable number is the
  // destination's StoreResult.bytes_written.
  bool stream_out = 7;
}

// One event in the backup stream. Exactly one arm is set; the terminal arm is
// always `result`. Mirrors the Deploy stream's log/result shape so the control
// plane reuses the same SSE plumbing.
message BackupEvent {
  oneof event {
    LogLine log = 1;
    BackupResult result = 2;
    // A slice of the finished artifact, emitted only under BackupRequest.stream_out.
    bytes data = 3;
  }
}

message BackupResult {
  // True => the dump completed and the artifact reached its destination.
  bool ok = 1;
  // A human-readable reason on failure (empty on success).
  string error = 2;
  // The object key written (echoes the destination's object_key on success) and
  // its size in bytes - recorded on the control plane's BackupRun.
  string object_key = 3;
  int64 size_bytes = 4;
  // Hex sha256 of the artifact as written.
  string sha256 = 5;
  // How big the artifact is once DECRYPTED - i.e. exactly how many bytes ReadStoreFile
  // emits when it is handed an age identity, which is what a download hands to a
  // browser.
  int64 decrypted_size_bytes = 6;
}

message RestoreRequest {
  BackupKind kind = 1;
  S3Target s3 = 2; // object_key points at the artifact to restore FROM
  DatabaseDescriptor database = 3;
  ProjectDescriptor project = 4;
  StoreTarget store = 5; // object_key points at the artifact to restore FROM
  // The age identity ("AGE-SECRET-KEY-1…") the artifact was encrypted to. Kept on THIS
  // message and never on BackupRequest so a private key cannot ride a routine nightly
  // backup out to a storage host.
  string age_identity = 6;
  // The hex sha256 the control plane recorded when it WROTE this artifact, so the agent
  // can prove the bytes it is about to act on are that artifact.
  string expected_sha256 = 7;
}

message RestoreEvent {
  oneof event {
    LogLine log = 1;
    RestoreResult result = 2;
  }
}

message RestoreResult {
  bool ok = 1;
  string error = 2;
}

message S3CheckRequest {
  // Bucket coordinates + creds; object_key is ignored (this is a bucket probe).
  S3Target s3 = 1;
  // Set instead of `s3` to probe a STORE root on this host: resolve it, honour the
  // sentinel rule, create the managed root if that is what was asked for, round-trip a
  // probe file, sweep stale `.partial` artifacts, and report headroom. object_key is
  // ignored.
  StoreTarget store = 2;
}

message S3CheckResponse {
  // True when the destination is reachable AND writable.
  bool ok = 1;
  // "" on success; a human-readable reason otherwise (bad creds, no bucket,
  // unmarked root, read-only mount) - surfaced as the destination's status detail.
  string error = 2;
  // Store probes only (0 for S3): the resolved root's filesystem headroom, so the UI
  // can show how much room a destination has left without a second RPC.
  int64 free_bytes = 3;
  int64 total_bytes = 4;
  // The root the agent actually resolved (the managed one when the request left
  // `root` empty), so the UI can show the real path rather than a blank.
  string root = 5;
}

message S3DeleteRequest {
  // s3.object_key is the key (or, with `prefix`, the prefix) to remove.
  S3Target s3 = 1;
  // When true, delete EVERY object under the destination's object_key as a
  // prefix (retention / delete-with-artifacts of a whole target's folder). When
  // false, delete the single exact key. Defaults to a single-key delete.
  bool prefix = 2;
  // Set instead of `s3` to delete from a STORE on this host. A prefix delete
  // here is a recursive directory removal, which is why StoreTarget's root rules
  // are not optional: a prefix that resolves to the root itself is REFUSED.
  StoreTarget store = 3;
}

message S3DeleteResponse {
  bool ok = 1;
  string error = 2;
  // How many objects were deleted (0 when already absent - still ok, idempotent).
  int64 deleted = 3;
}

// --------------------------------------------------------------------------- BACKUP
// STORES - the cross-host relay (ReadStoreFile / WriteStoreFile / RestoreFrom).

message ReadStoreFileRequest {
  // The artifact to stream out. Same root rules as every other StoreTarget.
  StoreTarget store = 1;
  // When set, DECRYPT on the way out (but do not decompress): the caller gets the
  // .tar.gz / .dump.gz the user actually wants to download.
  string age_identity = 2;
  // The hex sha256 the control plane recorded when it WROTE this artifact, so the agent
  // can prove the bytes it is about to act on are that artifact.
  string expected_sha256 = 3;
  // Set INSTEAD of `store` to read the artifact out of a BUCKET. It exists because a
  // backup a user cannot get their hands on is half a backup.
  S3Target s3 = 4;
}

// A framed chunk of an artifact transfer. ReadStoreFile emits a sequence of
// `data` chunks (no header). WriteStoreFile expects the FIRST message to be a
// `header` and all following messages to be `data`.
message StoreChunk {
  message Header {
    // Where to land the artifact on the DESTINATION host.
    StoreTarget store = 1;
    // Overwrite an artifact already at this key. False by default: object keys
    // carry a run id and are unique, so a collision means something is wrong and
    // silently clobbering it would destroy a good backup.
    bool overwrite = 2;
  }
  oneof frame {
    Header header = 1;
    // A raw slice of the (already age-encrypted) artifact. Chunked well under
    // the gRPC max message size; reassembled in order on the destination.
    bytes data = 2;
  }
}

message StoreResult {
  bool ok = 1;
  string error = 2;
  // What actually landed. A filesystem has no ETag, so these two are the only
  // durable proof of the transfer, and they are what the control plane records
  // on the BackupRun, not the source's own count.
  int64 bytes_written = 3;
  string sha256 = 4;
}

// A framed chunk of a cross-host restore (RestoreFrom), mirroring StoreChunk.
message RestoreChunk {
  message Header {
    BackupKind kind = 1;
    DatabaseDescriptor database = 2;
    ProjectDescriptor project = 3;
    // The age identity the artifact was encrypted to. Always required: this RPC
    // exists only for store artifacts, and those are always encrypted.
    string age_identity = 4;
    // The hex sha256 the control plane recorded when it WROTE this artifact, so the
    // agent can prove the bytes it is about to act on are that artifact.
    string expected_sha256 = 5;
    // The artifact came from OUTSIDE the fleet - a file somebody uploaded - so nothing
    // in it may ever configure what comes back up. That fallback exists for artifacts
    // Deplo itself wrote, before it recorded digests.
    bool untrusted_config = 6;
  }
  oneof frame {
    Header header = 1;
    bytes data = 2;
  }
}

// ---------------------------------------------------------------------------
// PART C - console observability (logs / attach / exec / instances)
// ---------------------------------------------------------------------------

// Every container RPC carries BOTH the project id and the already-resolved container
// NAME.

message FollowLogsRequest {
  // The project the container must belong to (agent re-validates the label).
  string project_id = 1;
  // The exact container name to stream (resolved control-plane-side from the
  // project's instances; the agent confirms it carries project_id's label).
  string container = 2;
  // Seed the stream with the last N lines before following live. 0 => 500.
  int32 tail = 3;
  // Time window, in Unix SECONDS. 0 means unset on both ends: no lower bound, and
  // follow live forever. Gated behind the `logs.timerange` capability; an agent without
  // it ignores these and streams `--tail` as before.
  int64 since_unix = 4;
  int64 until_unix = 5;
  // Prefix every line with its RFC3339Nano write time (`docker logs --timestamps`).
  bool timestamps = 6;
}

// One raw chunk of merged stdout+stderr. Bytes, not lines: a multi-byte UTF-8
// glyph or ANSI sequence split across reads is reassembled by the control
// plane's StringDecoder, exactly as the local `docker logs` pipe path does.
message LogChunk {
  bytes data = 1;
}

// A client->agent frame on the Attach stream. The first frame MUST be `open`.
message AttachInput {
  oneof frame {
    AttachOpen open = 1;     // FIRST message: selects the container + tty + size
    bytes data = 2;          // stdin keystrokes (raw bytes)
    AttachResize resize = 3; // terminal resize (tty containers only)
  }
}

message AttachOpen {
  string project_id = 1;     // agent re-validates the container's label
  string container = 2;
  // True for a tty:true container (a real pseudo-terminal is allocated, Go
  // creack/pty); false attaches over plain pipes. Resolved control-plane-side
  // from inspectStdio and passed in.
  bool tty = 3;
  int32 cols = 4;            // initial terminal size (tty only); 0 => 80
  int32 rows = 5;            // 0 => 24
}

message AttachResize {
  int32 cols = 1;
  int32 rows = 2;
}

// An agent->client frame on the Attach stream.
message AttachOutput {
  oneof frame {
    bytes data = 1;          // merged container output
    AttachExit exit = 2;     // the attach client exited (container stop/detach)
  }
}

message AttachExit {
  int32 code = 1;
}

message ListInstancesRequest {
  string project_id = 1;     // label filter: deplo.project=<project_id>
  string slug = 2;           // for the single-image synthetic service name
  // The Traefik-exposed service name (project.expose.service), so the agent can
  // flag the exposed instance for ordering. Empty => none exposed.
  string expose_service = 3;
}

// Mirrors lib/data/console.ts ConsoleInstance exactly (field-for-field) so the
// control plane maps it 1:1 without translation.
message ConsoleInstance {
  string name = 1;
  string service = 2;
  string image = 3;
  bool running = 4;
  bool exposed = 5;
  string user = 6;
  string workdir = 7;
  bool open_stdin = 8;
  bool tty = 9;

  // Fields 10-12 are ADDITIVE (contract stays V1): an older agent simply omits them and
  // the control plane falls back to `running`.

  // Raw docker state: "running" | "restarting" | "exited" | "created" |
  // "paused" | "dead" | "removing". Empty from an agent too old to send it.
  string state = 10;
  // Healthcheck verdict when the image defines one: "healthy" | "unhealthy" |
  // "starting". Empty when the container has no healthcheck (the common case),
  // NOT a synonym for healthy.
  string health = 11;
  // How many times docker has restarted this container. The number that turns
  // "it is starting" into "it has been dying for an hour".
  int32 restart_count = 12;
  // When the container last started, epoch seconds. 0 = never started, or an
  // agent too old to send it - both mean "no uptime to show", never 1970.
  int64 started_at_unix = 13;
}

message ListInstancesResponse {
  // Exposed/running first (the agent applies the same sort as listInstances).
  repeated ConsoleInstance instances = 1;
}

message ExecRequest {
  string project_id = 1;
  string container = 2;
  string command = 3;        // the raw command line (shell-interpreted or argv)
  string image = 4;          // for the shell-plan cache key
}

message ExecResponse {
  int32 code = 1;            // guest exit code (a non-zero exit is NOT an error)
  string stdout = 2;
  string stderr = 3;
  // True when the image had no shell and the command ran as raw argv (no pipes/
  // globbing) - the console renders a notice.
  bool raw_mode = 4;
}

message ShellLabelRequest {
  string project_id = 1;
  string container = 2;
  string image = 3;
}

message ShellLabelResponse {
  string label = 1;          // "/bin/sh" | "/bin/bash" | "raw exec (no shell)"
}

// ---------------------------------------------------------------------------
// CRON JOBS - agent-tracked container execs
// ---------------------------------------------------------------------------

// The retained-output ceiling for a job, per stream. Declared HERE, on the contract,
// because both sides trim: the agent so a `RUN yes` cannot grow the shared host's
// memory, the control plane defensively so a regressed agent cannot fill Postgres.

message CronEnvVar {
  string name = 1;
  string value = 2;
}

message StartJobRequest {
  // Re-validated agent-side against the container's `deplo.project` label, so a
  // control plane bug can never exec into another tenant's container.
  string project_id = 1;
  // Resolved LIVE by the control plane right before every attempt (a redeploy
  // mints a new container), never read back from a stored run row.
  string container = 2;
  string image = 3;            // shell-plan cache key, as in ExecRequest
  // "sh" | "bash" | "" (probe, as Exec does). A named shell that the image does
  // not have FAILS the job - it never silently falls back to the other one,
  // because `set -o pipefail` and `[[` change meaning between them.
  string shell = 4;
  string command = 5;          // run as `<shell> -lc <command>`
  int32 timeout_seconds = 6;   // agent-side hard deadline; 0 => 3600
  string workdir = 7;          // docker exec -w
  string user = 8;             // docker exec -u
  // Injected with `docker exec -e KEY` + the value in the docker CLIENT's own
  // environment, so a secret never rides argv where every user on the host can
  // read it out of `ps`. Same discipline as the REDISCLI_AUTH path in backup.go.
  repeated CronEnvVar env = 9;
}

message StartJobResponse {
  // Opaque handle, valid for the lifetime of THIS agent process only.
  string job_id = 1;
}

message PollJobRequest { string job_id = 1; }

message PollJobResponse {
  // false => this agent has no record of the job: it restarted, or the job
  // finished long enough ago to be evicted. The control plane records the run
  // as `lost` (outcome unknown), never as a failure.
  bool found = 1;
  bool running = 2;
  // Meaningful only when found && !running. -1 means the command never spawned
  // (no such container, no shell, the named shell is missing) - stderr says why.
  int32 exit_code = 3;
  string stdout = 4;           // EMPTY while running; else the last 16 KiB
  string stderr = 5;           // EMPTY while running; else the last 16 KiB
  bool timed_out = 6;          // killed at timeout_seconds rather than exiting
  int64 started_at_unix = 7;
  int64 finished_at_unix = 8;  // 0 while running
}

message KillJobRequest { string job_id = 1; }

message KillJobResponse {
  bool found = 1;              // false = nothing to kill; not an error
}

// ---------------------------------------------------------------------------
// PART C - project config files
// ---------------------------------------------------------------------------

// File RPCs key on SLUG, not project_id: the on-disk root is <stack-dir>/files/<slug>
// (the agent derives the root itself from its --stack-dir; it never takes a root path
// off the wire).

// Mirrors lib/data/project-files.ts FileEntry.
message FileEntry {
  string path = 1;           // relative to the files root, POSIX, no leading /
  string name = 2;
  string kind = 3;           // "dir" | "file"
  int64 size = 4;
  string modified_at = 5;    // ISO timestamp
}

// The common return for the mutating file ops (write/upload/mkdir/rename).
message FileEntryResult {
  FileEntry entry = 1;
}

message ListFilesRequest {
  string slug = 1;
  string path = 2;           // "" => the root
}

message ListFilesResponse {
  repeated FileEntry entries = 1;  // dirs first, then files, each alphabetical
}

message ReadFileRequest {
  string slug = 1;
  string path = 2;
}

message ReadFileResponse {
  string path = 1;
  // The UTF-8 text body. Empty when reason != "" (binary/too-large).
  string text = 2;
  int64 size = 3;
  // "" when text is present; "binary" or "too-large" when it is withheld -
  // matches lib/data/project-files.ts FileContent.reason byte-for-byte.
  string reason = 4;
}

message WriteFileRequest {
  string slug = 1;
  string path = 2;
  string content = 3;        // capped at 1 MiB agent-side
}

message UploadFileRequest {
  string slug = 1;
  string path = 2;
  // Raw bytes (the GraphQL layer base64-decodes; the wire carries binary).
  bytes data = 3;
}

message CreateDirRequest {
  string slug = 1;
  string path = 2;
}

message DeleteFileRequest {
  string slug = 1;
  string path = 2;
}

message DeleteFileResult {
  bool ok = 1;
}

message RenameFileRequest {
  string slug = 1;
  string path = 2;
  string new_path = 3;
}

message FilesExistRequest {
  string slug = 1;
}

message FilesExistResponse {
  bool exists = 1;
}

// ---------------------------------------------------------------------------
// PART D - dev containers + SSH gateway per server
// ---------------------------------------------------------------------------

// Everything the agent needs to start a project's dev container, all rendered by
// the control plane (D2: one renderer, opaque artifacts on the wire). The agent
// neither resolves the image nor renders labels - it writes files and runs Docker.
message StartDevRequest {
  // Project identity. `slug` keys the dev compose project / container name
  // (deplo-dev-<slug>), the stack file, the workspace dir, and the deps volume;
  // `project_id` goes into the deplo.* labels (already baked into compose_yaml).
  string slug = 1;
  string project_id = 2;

  // The fully-rendered dev compose YAML (renderDevCompose) - opaque to the agent,
  // written to <stack-dir>/dev-<slug>.yml (0600: it holds decrypted `development` env).
  string compose_yaml = 3;

  // The dev entrypoint script (DEV_ENTRY_SCRIPT) the compose bind-mounts.
  string entry_script = 4;

  // Source seeding (mirrors lib/deploy/dev.ts). Exactly one applies: - GIT: the control
  // plane minted a tokenized clone URL; the agent stages it to a root-owned 0600 file
  // the compose bind-mounts at /run/deplo/clone-url (never env / inspect-able).
  string clone_secret_url = 5;
  bytes upload_tar = 6;

  // The `-v <host>:/workspace` source for the pre-chown helper container, already
  // host-path-translated by the control plane (its container's data mount differs from
  // the in-container /data path; renderDevCompose does the same translation for the
  // compose binds).
  string workspace_host_path = 7;
}

message StopDevRequest {
  string slug = 1;
}

message TeardownDevRequest {
  string slug = 1;
}

// The rendered SSH-gateway config files + the user projection. The agent never
// re-implements the security-critical wrapper / sshd_config / allowlist in Go.
message GatewayConfig {
  // The rendered docker-compose for the 2-service gateway (proxy + gateway), already
  // host-path-translated by the control plane (renderGatewayCompose) so the bind mount
  // works whatever the agent's data layout is.
  string compose_yaml = 1;
  string sshd_config = 2;        // -> ssh-gateway/sshd_config
  string wrapper_script = 3;     // -> ssh-gateway/deplo-dev-shell (0755)
  string entrypoint_script = 4;  // -> ssh-gateway/gateway-entrypoint (0755)
  string socket_filter_cfg = 5;  // -> ssh-gateway/socket-filter.cfg
}

// One control-plane-computed gateway exec step the agent runs verbatim inside the
// gateway container: `docker exec -i <gateway> <argv...>`, optionally piping `input` to
// the command's stdin (chpasswd / file writes - the secret never hits argv/env that
// `docker inspect` could surface).
message GatewayStep {
  repeated string argv = 1;
  string input = 2;
}

// Ensure the gateway is up, then reconcile EVERY supplied user into it (the store is
// the sole source of truth - ADR-0002; the control plane sends the full provision plan
// for every DevSshUser of this server so a fresh gateway rebuilds its whole
// projection).
message EnsureGatewayRequest {
  GatewayConfig config = 1;
  // The provision steps for every stored user of this server, in order. Each
  // inner step-list provisions one account/key/map. Replayed on first boot and
  // after drift - provisioning is idempotent.
  repeated UserSteps users = 2;
}

// The ordered provision (or deprovision) steps for ONE user.
message UserSteps {
  repeated GatewayStep steps = 1;
}

message ProvisionSshUserRequest {
  // Ensure the gateway first (a user can be the first SSH user → lazy create).
  GatewayConfig config = 1;
  // The full user reconcile set (every stored user) so a just-created gateway is
  // rebuilt from the store, exactly like EnsureGateway. The agent provisions all.
  repeated UserSteps users = 2;
}

message DeprovisionSshUserRequest {
  // The deprovision steps for the one user being removed (pkill / deluser / rm).
  repeated GatewayStep steps = 1;
}

// ---- VS Code tunnel ----

message TunnelRequest {
  string slug = 1;
  // The launch script (tunnelLaunchScript) - only set on StartTunnel; rendered by
  // the control plane so the CLI download URL / tunnel name stay one source.
  string launch_script = 2;
}

// The agent returns the RAW tunnel log + running flag; the control plane parses
// it (parseTunnelLog) into the device-login link / connected URL - that logic
// stays pure and testable in TS, not duplicated in Go.
message TunnelStatus {
  bool running = 1;
  string log = 2;
}

// ---- Docker cleanup ----

// Which classes of object a cleanup may reclaim. Adding one would turn a disk-reclaim
// button into a data-loss button.
enum CleanupScope {
  CLEANUP_SCOPE_UNSPECIFIED = 0;
  // `docker builder prune` - the daemon's own BuildKit cache. Touches no Deplo
  // object at all.
  CLEANUP_SCOPE_BUILD_CACHE = 1;
  // `docker image prune` - untagged layers only, NEVER `-a`. A stopped container
  // still pins its image, so this cannot strand an app.
  CLEANUP_SCOPE_DANGLING_IMAGES = 2;
  // Dangling anonymous volumes that are PROVABLY buildkitd stores: the railpack builder
  // runs `moby/buildkit`, which declares VOLUME /var/lib/buildkit, and an orphaned one
  // is identified by the `buildkitd.lock` sentinel file at its mountpoint, never by
  // name, never by label.
  CLEANUP_SCOPE_ORPHAN_BUILDKIT_CACHE = 3;
  // Old `deplo/<slug>:<deployment>` images labelled deplo.managed=true that NO
  // container (running or exited) references, older than min_age_hours, minus the
  // newest keep_images_per_app per deplo.slug.
  CLEANUP_SCOPE_UNUSED_APP_IMAGES = 4;
  // `<stack-dir>/files/<slug>` directories belonging to no stack any more: the config
  // files of Apps and stacks that were DELETED. A directory younger than the grace
  // period is left alone too, so a stack being written right now is never a candidate.
  CLEANUP_SCOPE_LEFTOVER_APP_FILES = 5;
  // `deplo-env-*` / `deplo-team-*` / `deplo-preview-*` networks with NO container
  // attached and absent from live_networks: the networks of Environments and previews
  // that are gone. Never the platform's own (`deplo`, `deplo-internal`, `deplo-socket`).
  CLEANUP_SCOPE_LEFTOVER_NETWORKS = 6;
}

message DockerCleanupRequest {
  // The scopes to reclaim. Empty => nothing is done (ok, zero results): the
  // control plane, not the agent, owns the default set.
  repeated CleanupScope scopes = 1;
  // When true the agent ENUMERATES candidates and removes NOTHING; every
  // CleanupScopeResult is populated as if the removal had happened. This is what
  // the UI calls to render its confirm dialog.
  bool dry_run = 2;
  // Only reclaim objects older than this. 0 => no age filter. An object whose age the
  // agent cannot determine is never a candidate while an age filter is set (fail
  // closed).
  int32 min_age_hours = 3;
  // UNUSED_APP_IMAGES only: how many of the newest images to keep per deplo.slug.
  // 0 => 1 - the current tag is always kept, even when no container references it
  // (a stopped app must stay redeployable without a rebuild).
  int32 keep_images_per_app = 4;
  // UNUSED_APP_IMAGES only: a PER-SLUG override of keep_images_per_app, keyed by the
  // deplo.slug label. That over-keeps on an old host rather than under-keeping - a
  // rollback still works, it just costs more disk until the agent is updated.
  map<string, int32> keep_per_slug = 5;
  // LEFTOVER_APP_FILES only: every stack slug the control plane still knows - Apps,
  // their preview stacks (`<slug>__pr-<n>`) and databases - INSTANCE-WIDE, not just the
  // ones placed on this host.
  repeated string live_slugs = 6;
  // LEFTOVER_NETWORKS only: every tenant network the control plane still knows,
  // INSTANCE-WIDE. Empty list => the scope is skipped, never "remove everything".
  repeated string live_networks = 7;
}

message CleanupScopeResult {
  CleanupScope scope = 1;
  // Bytes reclaimed by this scope.
  int64 reclaimed_bytes = 2;
  int32 items_removed = 3;
  // The image ids / volume names / cache-record ids removed, or, under dry_run,
  // that WOULD be removed. Bounded to 200 entries; items_removed is authoritative.
  repeated string items = 4;
  // True when the agent DECLINED the scope: it could not build the
  // container-reference reverse index the scope's safety rests on, so it refused
  // to guess. A skipped scope is not a failure - the sweep continues.
  bool skipped = 5;
  // Per-scope failure. Non-fatal: the other scopes still run and the response is
  // still ok.
  string error = 6;
}

message DockerCleanupResponse {
  // False only when the whole sweep could not start.
  bool ok = 1;
  string error = 2;
  // The sum of the per-scope reclaimed_bytes.
  int64 reclaimed_bytes = 3;
  repeated CleanupScopeResult results = 4;
}

// ---------------------------------------------------------------------------
// ContainerStats - per-container `docker stats` for the Monitoring tab
// --------------------------------------------------------------------------- Messages
// for the ContainerStats RPC (declared up in the service block next to Metrics).

message ContainerStatsRequest {
  // The project the containers must belong to (agent re-validates the label
  // deplo.project=<project_id>). Empty is REJECTED - a blank filter would stat
  // every container on the host (cross-tenant), exactly like ListInstances.
  string project_id = 1;
  // The container names to stat (resolved control-plane-side from the project's
  // instances). Any name that does not carry project_id's label is dropped.
  // Empty => stat all of the project's containers.
  repeated string containers = 2;
}

// One container's live resource usage, parsed from `docker stats --no-stream`. net_* /
// block_* are CUMULATIVE totals since container start (that is what `docker stats`
// reports), NOT rates - the control plane derives bytes/sec from the delta between
// consecutive samples, which also survives a counter reset on restart. cpu_pct and
// mem_* are already instantaneous.
message ContainerStat {
  string name = 1;
  double cpu_pct = 2;      // 0-100 (across all cores, like `docker stats`)
  int64 mem_used = 3;      // bytes
  int64 mem_limit = 4;     // bytes
  double mem_pct = 5;
  int64 net_rx = 6;        // cumulative bytes received
  int64 net_tx = 7;        // cumulative bytes transmitted
  int64 block_read = 8;    // cumulative bytes read from block devices
  int64 block_write = 9;   // cumulative bytes written
  int32 pids = 10;
  // False for a container that exists in the project but is not running (stats
  // are zeroed), so the tab can distinguish "stopped" from "no such container".
  bool running = 11;

  // Fields 12-16 are ADDITIVE (contract stays V1).

  // The deplo.project label (an App id, prj_*, or a Database id) this container belongs
  // to - the demux key for the host-wide stream.
  string project_id = 12;
  // The full 64-hex Docker id. Stable for a container's lifetime and CHANGES on
  // recreation, which is exactly what the rate calculator needs in order to drop
  // a stale previous sample instead of emitting a bogus negative delta.
  string container_id = 13;

  // Fields 14-16 mirror ConsoleInstance's state/health/restart_count field-for- field
  // so the control plane maps them with no translation.

  // Raw docker state: "running" | "restarting" | "exited" | "created" |
  // "paused" | "dead" | "removing". Empty from an agent too old to send it.
  string state = 14;
  // Healthcheck verdict when the image defines one: "healthy" | "unhealthy" |
  // "starting". Empty when the container has no healthcheck (the common case),
  // NOT a synonym for healthy.
  string health = 15;
  // How many times docker has restarted this container. The number that turns
  // "it is starting" into "it has been dying for an hour".
  int32 restart_count = 16;

  // Fields 17-18 are ADDITIVE (contract stays V1). net_* is read out of the
  // container's network NAMESPACE, and a namespace can have several containers
  // in it: a compose sidecar on `network_mode: service:x` reports the SAME
  // counters as its host container, so summing a stack double-counted them.
  // 0 from an agent too old to send it, or when the namespace is unreadable.
  uint64 net_ns_id = 17;
  // True when that namespace is the HOST's - `network_mode: host`. net_rx/net_tx
  // are then the whole machine's counters, so the agent reports them as 0 and
  // the panel points at the host chart instead.
  bool net_ns_host = 18;
}

message ContainerStatsResponse {
  repeated ContainerStat stats = 1;
}

// ---------------------------------------------------------------------------
// StreamMetrics - one long-lived telemetry stream per host
// --------------------------------------------------------------------------- Appended
// at the END of the file for the same reason ContainerStats was: the wire is identical
// wherever they sit, but keeping additions last leaves the committed *.pb.go / agent.ts
// diff purely additive.

message MetricsStreamRequest {
  // The path whose filesystem to measure for disk usage (the agent's data dir).
  // Empty => the agent's own --data-dir, exactly like MetricsRequest.
  string data_dir = 1;
  // Sampling cadence. 0 => the agent's default (5000). The agent CLAMPS this to
  // [1000, 60000]: a cadence is a HINT, never a way for a caller to pin the host
  // by asking for 10ms samples.
  int32 interval_ms = 2;
  // False => host metrics only. No container roster, no `docker ps`, no stats -
  // for a caller that only wants the host gauge.
  bool include_containers = 3;
}

// One tick. `host` is always present; `containers` is empty unless the request
// asked for them (or nothing Deplo-managed is running on this host).
message MetricsSample {
  HostMetrics host = 1;
  repeated ContainerStat containers = 2;
  // The AGENT's clock at sample time.
  int64 sampled_at_unix_ms = 3;
  // Which backend produced this frame: "cgroup2" | "docker-stats". It lets the control
  // plane surface "this host is on the slow path" (~18x the CPU cost) without a second
  // RPC, and makes an automatic demotion visible instead of silent.
  string source = 4;
}

// ---------------------------------------------------------------------------
// HOST OPS (hostops capability)
// ---------------------------------------------------------------------------

message HostInfoRequest {
  // The path whose filesystem to measure, same contract as MetricsRequest.
  // Empty => the agent's own --data-dir.
  string data_dir = 1;
  // The caller's own hostname.
  string control_plane_hint = 2;
}

// What this host IS, as opposed to what it is currently doing.
message HostInfoResponse {
  // e.g. "AMD Ryzen 5 5600X 6-Core Processor" (/proc/cpuinfo "model name").
  string cpu_model = 1;
  // PHYSICAL cores, deduplicated by (physical id, core id). 6 on the chip above.
  int32 cpu_cores = 2;
  // Logical processors - what schedulers and `nproc` count. 12 on the chip above.
  int32 cpu_threads = 3;
  // bytes
  int64 mem_total_bytes = 4;
  int64 disk_total_bytes = 5;
  int64 disk_used_bytes = 6;
  // /etc/os-release PRETTY_NAME, e.g. "Ubuntu 24.04.1 LTS".
  string os_pretty = 7;
  // uname -r, e.g. "6.8.0-136-generic".
  string kernel = 8;
  // uname -m, e.g. "x86_64" / "aarch64".
  string arch = 9;
  // Docker server version, "" when the daemon is unreachable.
  string docker_version = 10;
  // Docker's data root (`docker info -f {{.DockerRootDir}}`), where images and
  // volumes actually live, which is not always the disk the operator assumes.
  string docker_root_dir = 11;
  int64 uptime_sec = 12;
  // IANA zone name, e.g. "Europe/Rome". Read from the /etc/localtime symlink.
  string timezone = 13;
  // The host's clock at the moment of the read, and its offset from UTC in
  // MINUTES (not hours: Kathmandu is +345, India +330).
  int64 time_unix_ms = 14;
  int32 utc_offset_minutes = 15;
  // The current $AGENT_DATA/traefik/docker-compose.yml, verbatim. Empty when
  // Deplo did not install Traefik here, which is exactly the signal that
  // TraefikConfig must refuse to write.
  string traefik_compose_yaml = 16;
  // The resolved container id for control_plane_hint, or "" when the hint named
  // nothing running. Non-empty means RestartControlPlane can do its job.
  string control_plane_container = 17;
}

message SetTimezoneRequest {
  // IANA zone name. Must exist under /usr/share/zoneinfo.
  string timezone = 1;
  // Passed straight through to the HostInfoResponse this answers with.
  string data_dir = 2;
  string control_plane_hint = 3;
}

message TraefikConfigRequest {
  // The full docker-compose.yml for the deplo-traefik stack, rendered control
  // plane-side. Ignored when restart_only.
  string compose_yaml = 1;
  // Restart the existing stack without touching its file on disk. This is the
  // plain "restart Traefik" button; a config change sends the YAML instead.
  bool restart_only = 2;
}

message TraefikConfigResponse {
  bool ok = 1;
  // Why not, verbatim for the operator - most usefully "this host runs a Traefik
  // Deplo did not install".
  string error = 2;
  // The stack file as it stands AFTER the operation, so the control plane never
  // has to assume its write landed byte-for-byte.
  string compose_yaml = 3;
}

message RestartControlPlaneRequest {
  // The caller's own hostname / container id - see HostInfoRequest.
  string control_plane_hint = 1;
}

message RestartControlPlaneResponse {
  // True => a restart was SCHEDULED (moments from now), not completed: the reply
  // has to outrun the restart it triggers, so the agent cannot report the result.
  bool ok = 1;
  string error = 2;
  // The container the agent is about to restart, echoed back so the operator can
  // see WHICH thing was named.
  string container = 3;
}
