version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"

  # A stdlib, gRPC or x/crypto advisory here is pre-auth surface on the agent's
  # gRPC port, so the module tree is watched too - not only the workflows.
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
