version: 2
updates:
  # One label per PR; the default adds an ecosystem label too.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
    labels: ["dependencies"]

  # A stdlib, gRPC, x/crypto or WebSocket advisory here is pre-auth surface on the
  # agent link, so the module tree is watched too - not only the workflows.
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
    labels: ["dependencies"]
