# Test + vet on every push and PR. The release workflow re-runs tests before it
# builds, so a green CI here is the gate for tagging a release.
name: ci

on:
  push:
    branches: ["main"]
    # The CLA bot commits a signature here on every new contributor. No Go code
    # changes, so nothing to test.
    paths-ignore: ["signatures/**"]
  pull_request:
  # Weekly, so an advisory published against a dependency we already ship turns
  # the repo red on its own instead of waiting for the next commit. Mirrors the
  # control plane's weekly `bun audit` run.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # Formatting is enforced by the pre-commit hook (.githooks/pre-commit); these
      # two steps are the backstop for a commit made with --no-verify. gofmt owns
      # the Go, Prettier owns the Markdown and these workflows.
      - name: gofmt
        run: |
          out=$(gofmt -l $(git ls-files '*.go'))
          [ -z "$out" ] || { echo "gofmt wants these files:"; echo "$out"; exit 1; }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: go vet ./...
      # The agent's gRPC port is reachable by anyone who can open a socket, and
      # the TLS handshake + client-cert parse happen BEFORE mTLS proves anything,
      # so a stdlib crypto/tls or crypto/x509 advisory is pre-auth surface here.
      # `go-version-file: go.mod` above means the `go` directive is also the
      # toolchain pin: bump it to patch the standard library.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - run: go test ./...
      - name: Verify it builds static for both target arches
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" go build -o /dev/null .
          done
