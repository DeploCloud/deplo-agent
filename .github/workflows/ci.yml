# Test + vet on every push and PR. The release workflow builds nothing until this
# run is green on the tagged commit.
name: ci

on:
  push:
    branches: ["main"]
    # The CLA bot commits a signature here on every new contributor. No Go code
    # changes, so nothing to test.
    paths-ignore: ["signatures/**"]
  pull_request:
  # Weekly, so an advisory published against a dependency we already ship turns
  # the repo red on its own instead of waiting for the next commit. Mirrors the
  # control plane's weekly `bun audit` run.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  # A merge whose tree a pull request already tested green has nothing new to check.
  tested:
    name: Already tested
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      skip: ${{ steps.pr.outputs.skip }}
    steps:
      - id: pr
        if: github.event_name == 'push'
        # A failure here runs every check, never skips one.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          api() { gh api "repos/$GITHUB_REPOSITORY/$1" --jq "$2"; }
          tree=$(api "commits/$GITHUB_SHA" .commit.tree.sha)
          skip=false
          # The head held all of main and is this exact tree, so the pull request's run tested this commit.
          for head in $(api "commits/$GITHUB_SHA/pulls" '.[] | select(.merged_at) | .head.sha'); do
            [ "$(api "compare/$BEFORE...$head" .behind_by)" = 0 ] || continue
            [ "$(api "commits/$head" .commit.tree.sha)" = "$tree" ] || continue
            run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --event pull_request --commit "$head" --status success --limit 1 --json databaseId --jq '.[].databaseId')
            [ -n "$run" ] || continue
            echo "::notice::pull request run $run already tested this tree green"
            skip=true
          done
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  test:
    needs: tested
    # Nothing in it changes between two runs on one commit, so the weekly run leaves it out.
    if: github.event_name != 'schedule' && needs.tested.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # Formatting is enforced by the pre-commit hook (.githooks/pre-commit); these
      # two steps are the backstop for a commit made with --no-verify. gofmt owns
      # the Go, Prettier owns the Markdown and these workflows.
      - name: gofmt
        run: |
          out=$(gofmt -l $(git ls-files '*.go'))
          [ -z "$out" ] || { echo "gofmt wants these files:"; echo "$out"; exit 1; }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: go vet ./...
      # Static like the shipped binary.
      - run: go test ./...
        env:
          CGO_ENABLED: "0"
          # A runner serves nothing, so the tests that drive a real Docker daemon run here and nowhere by accident.
          DEPLO_AGENT_TEST_REAL_DOCKER: "1"
      # The cluster's name server parses packets from anyone, so it runs with none of the agent's privileges
      # (ADR-0049). The agent runs as root, so this does too: the test fails if it was skipped.
      - name: The name server has none of the agent's privileges
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go test -c -o "$RUNNER_TEMP/dnszone.test" ./internal/dnszone
          sudo "$RUNNER_TEMP/dnszone.test" -test.run 'TestProcess_|TestSupervisor_' -test.count=1 -test.v | tee "$RUNNER_TEMP/dnszone.log"
          grep -q -- '--- PASS: TestProcess_hasNoneOfTheAgentsPrivileges' "$RUNNER_TEMP/dnszone.log"
      # The certificate checks' endpoint listens inside the proxy's own network only (ADR-0049 phase 3).
      - name: The checks' endpoint is reachable from the proxy's network alone
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go test -c -o "$RUNNER_TEMP/server.test" ./internal/server
          sudo "$RUNNER_TEMP/server.test" -test.run 'TestChallenge_listensOnlyInTheProxysNetwork' -test.count=1 -test.v | tee "$RUNNER_TEMP/server.log"
          grep -q -- '--- PASS: TestChallenge_listensOnlyInTheProxysNetwork' "$RUNNER_TEMP/server.log"
      - name: Fuzz the name server's packet path
        run: go test ./internal/dnszone -run '^$' -fuzz '^FuzzReply$' -fuzztime 30s
      - name: Fuzz the client subnet a resolver sends
        run: go test ./internal/dnszone -run '^$' -fuzz '^FuzzClientSubnet$' -fuzztime 30s
      - name: Verify it builds static for both target arches
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" go build -o /dev/null .
          done

  vulncheck:
    needs: tested
    if: needs.tested.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # The agent's gRPC port is reachable by anyone who can open a socket, and
      # the TLS handshake + client-cert parse happen BEFORE mTLS proves anything,
      # so a stdlib crypto/tls or crypto/x509 advisory is pre-auth surface here.
      # `go-version-file: go.mod` above means the `go` directive is also the
      # toolchain pin: bump it to patch the standard library.
      # PINNED, not @latest: a new major of the tool can require a newer Go than
      # the pin above. The advisory database is fetched at run time, so an older
      # binary still reports today's CVEs.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  # The answers' routes are a contract with the panel (DeploCloud/deplo, docs/agents/cluster-rollout.md §7): the
  # agent changes first, so the panel's reference may lag this one's, but what the panel renders today must still
  # pass this agent's checks, or every App of a cluster would stop answering everywhere.
  panel-contract:
    needs: tested
    if: needs.tested.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DeploCloud/deplo
          path: panel
          sparse-checkout: |
            lib/deploy/answer-routes.golden.json
            lib/deploy/cluster-zone.golden.json
            lib/geo/geo-table.golden.bin
            lib/geo/geo-lookups.golden.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Compare with the panel's reference
        run: |
          if [ ! -f panel/lib/deploy/answer-routes.golden.json ]; then echo "the panel has no reference yet"; exit 0; fi
          if diff <(jq -S . internal/server/testdata/answer-routes.golden.json) <(jq -S . panel/lib/deploy/answer-routes.golden.json); then
            echo "the two references are the same"
          else
            echo "::notice::the panel's reference differs from this agent's: the panel has not caught up yet"
          fi
      - name: This agent accepts what the panel renders today
        run: go test ./internal/server -run 'TestAnswers_thePanelsReferencePasses|TestZone_thePanelsRequestPasses' -count=1 -v
        env:
          CGO_ENABLED: "0"
          DEPLO_REPO: ${{ github.workspace }}/panel
      # The location table the panel's release builds (ADR-0049 phase 2), reduced from the same small CSV.
      - name: This agent reads the panel's location table
        run: |
          if [ ! -f panel/lib/geo/geo-table.golden.bin ]; then echo "the panel has no location table yet"; exit 0; fi
          cp panel/lib/geo/geo-table.golden.bin panel/lib/geo/geo-lookups.golden.json internal/dnszone/testdata/
          go test ./internal/dnszone -run 'TestGeo_thePanelsTableParses' -count=1 -v
        env:
          CGO_ENABLED: "0"
