# Build and publish the agent binaries on a version tag.
#
# The control plane (IdraDev/deplo) installs the agent by downloading these
# release assets and verifying their sha256 against checksums.txt, so the asset
# NAMES and the checksums format are a contract:
#
#   deplo-agent-linux-amd64
#   deplo-agent-linux-arm64
#   checksums.txt          (sha256sum format: "<hex>  <filename>" per line)
#
# lib/agent/release.ts (control plane) greps checksums.txt by these basenames and
# install-agent.sh picks one by `uname -m`. Do not rename the assets without
# updating both sides.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the release + upload assets
  # Sigstore keyless signing: the OIDC token is the identity, so there is no key
  # to store or rotate.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Build static binaries (amd64, arm64)
        run: |
          set -euo pipefail
          # Strip a leading v from the tag for the stamped version (matches the
          # control plane, which normalizes tags the same way).
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Building deplo-agent ${VERSION} for linux/amd64 and linux/arm64"
          LDFLAGS="-s -w -X github.com/DeploCloud/deplo-agent/internal/server.AgentVersion=${VERSION}"
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" \
              go build -trimpath -ldflags "${LDFLAGS}" \
              -o "dist/deplo-agent-linux-${arch}" .
          done

      - name: Generate checksums.txt
        working-directory: dist
        run: |
          set -euo pipefail
          # sha256sum's native format is exactly what the consumers parse.
          sha256sum deplo-agent-linux-amd64 deplo-agent-linux-arm64 > checksums.txt
          echo "--- checksums.txt ---"
          cat checksums.txt

      # Proves this workflow built these exact binaries, so `gh attestation verify`
      # answers "did this come from our CI" without trusting the release page.
      - name: Attest the binaries' provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/deplo-agent-linux-*

      # Read off the SHIPPED binary, not go.mod, so "are we affected by this CVE?"
      # is a query. Both arches build from one module graph, so one list covers them.
      - name: Generate the SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          file: dist/deplo-agent-linux-amd64
          format: spdx-json
          output-file: dist/deplo-agent-${{ github.ref_name }}.spdx.json
          upload-artifact: false

      - name: Attest the SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/deplo-agent-linux-*
          sbom-path: dist/deplo-agent-${{ github.ref_name }}.spdx.json

      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            dist/deplo-agent-linux-amd64
            dist/deplo-agent-linux-arm64
            dist/checksums.txt
            dist/deplo-agent-${{ github.ref_name }}.spdx.json
          generate_release_notes: true
